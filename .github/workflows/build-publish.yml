name: Build and publish Bitnami Redis family

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }} (no publishing)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: redis
            context: ./bitnami-redis
            image: ghcr.io/reallyenglish-global/bitnami-redis
            version: 8.10.3-debian-12-r1
          - component: sentinel
            context: ./bitnami-sentinel
            image: ghcr.io/reallyenglish-global/bitnami-sentinel
            version: 8.10.3-debian-12-r1
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  publish:
    name: Publish ${{ matrix.component }}
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: redis
            context: ./bitnami-redis
            image: ghcr.io/reallyenglish-global/bitnami-redis
            version: 8.10.3-debian-12-r1
          - component: sentinel
            context: ./bitnami-sentinel
            image: ghcr.io/reallyenglish-global/bitnami-sentinel
            version: 8.10.3-debian-12-r1
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The GitHub actor is passed only as a registry-login field, never interpolated into a shell command.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
